name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v5.1.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Global Packages (Ionic & Cordova)
        run: |
          npm install -g @ionic/cli cordova

      - name: Install Dependencies
        run: |
          npm ci --no-audit

      - name: Build Cordova Moodle Plugin
        run: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Overwrite Target moodle.config.json
        run: |
          node -e "
          const fs = require('fs');
          const path = 'moodle.config.json';
          
          let configData = {};
          if (fs.existsSync(path)) {
              configData = JSON.parse(fs.readFileSync(path, 'utf8'));
          }
          
          configData.app_id = 'com.moodle.moodlemobile';
          configData.appname = 'Stoicus SDO';
          configData.siteurl = 'https://exam.stoicus.ru';
          configData.onlyallowlistedsites = true;
          configData.typeoflogin = 1;
          configData.customurlscheme = 'moodlemobile';
          configData.default_lang = 'ru';
          configData.forcedefaultlanguage = true;
          
          // Жестко привязываем к песочнице и указываем правильный путь к логотипу в сборке
          configData.sites = [
              {
                  \"id\": \"stoicussdo\",
                  \"name\": \"Stoicus SDO\",
                  \"url\": \"https://exam.stoicus.ru\",
                  \"logo\": \"assets/img/top_logo.png\"
              }
          ];
          
          fs.writeFileSync(path, JSON.stringify(configData, null, 4), 'utf8');
          console.log('Конфигурация moodle.config.json успешно записана для exam.stoicus.ru!');
          "

      - name: Run Production Web Build
        run: |
          npm run build:prod

      - name: Overwrite Android Vector Splash Screen
        run: |
          node -e "
          const fs = require('fs');
          const xmlPath = 'resources/android/android-splash.xml';
          
          // Создаем минималистичный векторный сплэш:
          // Фон — чистый белый (или замени #FFFFFF на цвет твоей школы)
          // По центру рендерится аккуратный минималистичный круг или квадрат, пока грузится приложение
          const customXml = \`<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <vector xmlns:android=\"http://schemas.android.com/apk/res/android\"
              android:width=\"108dp\"
              android:height=\"108dp\"
              android:viewportWidth=\"108\"
              android:viewportHeight=\"108\">
              
              <!-- Фоновая подложка иконки сплэша (круг бренда) -->
              <path
                  android:fillColor=\"#2A2E3D\" 
                  android:pathData=\"M54,54m-40,0a40,40 0,1 1,80 0a40,40 0,1 1,-80 0\" />
                  
              <!-- Внутренняя геометрия (минималистичная заглушка, пока не подгрузился основной интерфейс) -->
              <path
                  android:fillColor=\"#FFFFFF\"
                  android:pathData=\"M45,35 L63,35 L63,45 L45,45 Z M45,55 L63,55 L63,73 L45,73 Z\" />
          </vector>\`;
          
          // Проверяем существование папки и пишем файл
          if (!fs.existsSync('resources/android')) {
              fs.mkdirSync('resources/android', { recursive: true });
          }
          
          fs.writeFileSync(xmlPath, customXml, 'utf8');
          console.log('Оранжевый вектор Moodle успешно уничтожен и заменен брендовым XML!');
          "

      - name: Fix Cordova Android Folder Conflict
        run: |
          # Превентивно удаляем конфликтные директории до инициализации платформы
          rm -rf android platforms/android

      - name: Generate Native Icons and Splash Screens
        run: |
          npm install -g cordova-res
          cordova-res android

      - name: Initialize Cordova Android Platform
        run: |
          ionic cordova platform add android --no-interactive

      - name: Compile Application Package
        run: |
          ionic cordova build android --prod --no-interactive

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stoicus-SDO-App-v5.1.x
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
            platforms/android/.**/*.apk
            **/*.apk
          if-no-files-found: error
