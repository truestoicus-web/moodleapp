name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v5.1.x

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Setup Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: |
          npm ci

      - name: Install Capacitor Core Android Packages
        run: |
          npm install @capacitor/android@latest @capacitor/cli@latest

      - name: Build and Initialize Android Platform
        run: |
          npm run build:prod
          npx cap add android

      - name: Sync Web Code to Android
        run: |
          npx cap sync android

      - name: Build Android App with Gradle
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stoicus-SDO-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
