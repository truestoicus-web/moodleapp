name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v5.1.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Global Packages
        run: |
          npm install -g @ionic/cli cordova cordova-res

      - name: Install Dependencies
        run: |
          npm ci --no-audit

      - name: Build Cordova Moodle Plugin
        run: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Run Production Web Build
        run: |
          npm run build:prod

      - name: Generate and Inject Android Resources
        run: |
          ionic cordova platform add android --no-interactive
          cordova-res android --type=icon --skip-config --copy || true

      - name: Compile Application Package
        run: |
          ionic cordova build android --prod --no-interactive

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stoicus-SDO-App-v5.1.x
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
            platforms/android/.**/*.apk
            **/*.apk
          if-no-files-found: error
