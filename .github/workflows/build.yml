name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v5.1.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Global Packages (Ionic & Cordova)
        run: |
          npm install -g @ionic/cli cordova

      - name: Install Dependencies
        run: |
          npm ci --no-audit

      - name: Build Cordova Moodle Plugin
        run: |
          npm run prod --prefix cordova-plugin-moodleapp

      - name: Inject Moodle Config into App Environment
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('moodle.config.json', 'utf8'));
          const targetPath = 'src/theme/variables.scss'; 
          console.log('Конфигурация сайта подхвачена:', config.siteurl);
          "
          npm run base-config || true

      - name: Generate Web Assets
        run: |
          npm run build:prod

      - name: Initialize and Build Cordova Android Platform
        run: |
          ionic cordova platform add android --no-interactive
          ionic cordova build android --prod --no-interactive

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stoicus-SDO-App-v5.1.x
          path: |
            platforms/android/app/build/outputs/apk/**/*.apk
            platforms/android/.**/*.apk
            **/*.apk
          if-no-files-found: error
